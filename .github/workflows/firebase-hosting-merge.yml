# Deploy on merge to main.
# Mirrors `npm run deploy` (= `npm run build && firebase deploy`): a full
# firebase deploy of Hosting (Next.js web frameworks) + Cloud Functions +
# Firestore rules/indexes — not hosting only.
name: Deploy to Firebase on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once.
concurrency:
  group: firebase-deploy-main
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      FIREBASE_CLI_EXPERIMENTS: webframeworks
      # NEXT_PUBLIC_* are inlined into the client bundle at build time.
      # .env.local is gitignored, so they must come from repo secrets.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_ONESIGNAL_APP_ID: ${{ secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Install & build functions
        # Required so firebase.json's functions predeploy (tsc) has its deps,
        # and so the functions codebase is deployable.
        run: |
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Build Next.js app
        run: npm run build

      - name: Authenticate to Firebase
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/firebase-sa.json"
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IXCA_BUGDET }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy (hosting + functions + firestore)
        run: npx --yes firebase-tools@latest deploy --project ixca-bugdet --non-interactive --force
